name: Weekly angler posts

on:
  schedule:
    - cron: '11 14 * * 1'   # Mondays, about 7:11 am Pacific (6:11 am in winter)
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/fetch-angler.mjs'
      - '.github/workflows/angler-posts.yml'

permissions:
  contents: write

# Shares the daily data workflow's group so the two never push at the same time.
concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Each run costs a little (Apify and the Claude API), so pull requests only check the script parses.
      - name: Check the angler posts script
        if: github.event_name == 'pull_request'
        run: node --check scripts/fetch-angler.mjs
      - name: Fetch angler posts from Facebook groups and TikTok
        if: github.event_name != 'pull_request'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @anthropic-ai/sdk@0.135.0
          node scripts/fetch-angler.mjs
      - name: Commit updated posts
        if: github.event_name != 'pull_request'
        run: |
          files="data/angler.js data/angler-seen.json"
          if git diff --quiet -- $files; then echo "Angler posts unchanged."; exit 0; fi
          git config user.name "daily-data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "Update angler posts"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
