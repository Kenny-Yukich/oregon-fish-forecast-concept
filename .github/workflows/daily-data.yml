name: Daily data

on:
  schedule:
    - cron: '41 13 * * *'   # daily, about 6:41 am Pacific
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/fetch-counts.mjs'
      - 'scripts/fetch-stocking.mjs'
      - 'scripts/fetch-conditions.mjs'
      - 'scripts/fetch-weather.mjs'
      - 'scripts/fetch-reports.mjs'
      - '.github/workflows/daily-data.yml'

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STRICT: ${{ github.event_name == 'pull_request' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch daily fish counts from Columbia River DART
        run: node scripts/fetch-counts.mjs
      - name: Fetch ODFW trout stocking schedule
        run: node scripts/fetch-stocking.mjs
      - name: Fetch USGS river flow and temperature
        run: node scripts/fetch-conditions.mjs
      - name: Fetch National Weather Service forecasts and alerts
        continue-on-error: true
        run: node scripts/fetch-weather.mjs
      # Claude only reads a source when it changed (a new WDFW creel PDF or new ODFW rules text), so pull requests only check the script parses.
      - name: Check the reports and rules script
        if: github.event_name == 'pull_request'
        run: node --check scripts/fetch-reports.mjs
      - name: Read WDFW creel reports and ODFW regulation updates
        if: github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 10
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @anthropic-ai/sdk@0.135.0
          node scripts/fetch-reports.mjs
      - name: Commit updated data
        if: github.event_name != 'pull_request'
        run: |
          files="data/counts.js data/stocking.js data/conditions.js data/weather.js data/auto-reports.js"
          if git diff --quiet -- $files; then echo "Data unchanged."; exit 0; fi
          git config user.name "daily-data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "Update daily fish counts, stocking, river conditions, weather and reports"
          git push
