name: Fish counts

on:
  schedule:
    - cron: '41 13 * * *'   # daily, about 6:41 am Pacific
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/fetch-counts.mjs'
      - '.github/workflows/fish-counts.yml'

permissions:
  contents: write

concurrency:
  group: fish-counts
  cancel-in-progress: false

jobs:
  counts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch daily counts from Columbia River DART
        env:
          STRICT: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: node scripts/fetch-counts.mjs
      - name: Commit updated counts
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/counts.js; then echo "Counts unchanged."; exit 0; fi
          git config user.name "fish-counts bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/counts.js
          git commit -m "Update daily fish counts"
          git push
