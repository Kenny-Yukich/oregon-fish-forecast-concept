<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Oregon Fish Forecast</title>
  <!-- The classic design was retired on Nov 25, 2026. This address only forwards old links (bookmarks, earlier
       alert emails and Eddy answers) to the same page on the homepage. -->
  <script>
    (function () {
      var hash = location.hash.replace(/^#\/?/, ''), cut = hash.indexOf('?');
      var path = cut < 0 ? hash : hash.slice(0, cut), query = new URLSearchParams(cut < 0 ? '' : hash.slice(cut + 1));
      var keep = function (names) {
        var out = new URLSearchParams();
        names.forEach(function (n) { if (query.get(n)) out.set(n, query.get(n)); });
        return out.toString() ? '?' + out : '';
      };
      var to = '';
      if (/^water\/[a-z0-9-]+$/.test(path)) to = '#/' + path;
      else if (path === 'map') to = '#/map' + keep(['water']);
      else if (path === 'stocking') to = '#/stocking' + keep(['q', 'weeks']);
      else if (path === 'approach' || path === 'sources') to = '#/method';
      else if (path === 'waters' || path === 'membership') to = '#/waters' + keep(['q']);
      location.replace('../' + to);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=../"></noscript>
</head>
<body style="background:#0f2e22;color:#f3f1e4;font:16px/1.5 system-ui,sans-serif;padding:24px">
  <p>The classic Oregon Fish Forecast pages have moved to the homepage. <a style="color:#f5e23a" href="../">Continue</a></p>
</body>
</html>
